syntax = "proto3";

//
// This package defines message types used to represent a performance measurement record
// in a TAPI stream as per the specifications in TR548.
//
package tapi;

option java_multiple_files = true;
option java_outer_classname = "TapiGnmi";
option java_package = "org.linuxfoundation.onmi.tapi";

message StreamDetails
     MeasurememtDetails measurement_details = 1;
}
message MeasurementDetails {
     uint64 time_measurement_was_sampled  = 1; 
     QualifiedMeasuredValue qualified_measured_value = 2; 
     string native_resource_id = 3;
     SampleQualifier sample_qualifier = 4; 
     RelativePosition relative_position_of_measurement = 5; 
     DirectionOfMeasuredSignal direction_of_measured_signal = 6; 
     uint64 sample_interval = 7;
     string abstract_resource_ref = 8; 
     string native_measurement_type = 9;
     NormalizedMeasurementType normalized_measurement_type = 10;
     repeated QualifiedMeasurment qualified_measurement = 11;
     string connection-end-point = 12;
     string maintenance-intermediate-point = 13;
     string maintenance-end-point = 14;
     uint64 measurement_start_time = 15;
     repeated QualifiedMeasuredValue qualified_measured_value_set = 16;
}    
message QualifiedMeasurement {
     uint64 time_measurement_was_sampled  = 1; 
     QualifiedMeasuredValue qualified_measured_value = 2; 
     string native_resource_id = 3;
     SampleQualifier sample_qualifier = 4; 
     RelativePosition relative_position_of_measurement = 5; 
     DirectionOfMeasuredSignal direction_of_measured_signal = 6; 
     uint64 sample_interval = 7;
     string abstract_resource_ref = 8; 
     string native_measurement_type = 9;
     NormalizedMeasurementType normalized_measurement_type = 10;
     uint64 list_index = 11;
     string connection-end-point = 12;
     string maintenance-intermediate-point = 13;
     string maintenance-end-point = 14;
     uint64 measurement_start_time = 15;
     repeated QualifiedMeasuredValue qualified_measured_value_set = 16;
}  
message QualifiedMeasuredValue {
     double value = 1;
     ValueQualifier value_qualifier = 2;
     string units = 3;
     string qualified_value_name = 4;
     string qualified_location_name = 5;
     string qualified_measurement_type = 6;
}
enum ValueQualifier {
     OK = 0;
     INVALID = 1;
     SUSPECT = 2;
     MISSING = 3;
     PARTIAL = 4;
}
enum RelativePosition {
     NEAR_END = 0;
     FAR_END = 1;
     NOT_APPLICABLE = 2;
     ALL_LOCATIONS = 3;
}
enum DirectionOfMeasuredSignal {
     NO_DIRECTION = 0;
     RECEIVE =1;
     TRANSMIT = 2;
     RECEIVE_AND_TRANSMIT = 3;
     CONTRA_RECEIVE = 4;
     CONTRA_TRANSMIT = 5;
     CONTRA_RECEIVE_AND_CONTRA_TRANSMIT = 6;
}   
enum SampleQualifier {
     NORMAL = 0;
     DELAYED = 1;
     FINAL = 2;
     FIRST = 3;
     BASELINE=4;
}

enum NormalizedMeasurementType {
     NO_NORMALIZED_TYPE = 0;
     BBE = 1;
     CHROM_DISP = 2;
     DELAY_FRAME_COUNT = 3;
     DIFF_GROUP_DELAY = 4;
     FEC_CORRECTABLE_BLOCKS = 5;
     FEC_CORRECTED_BITS = 6;
     FEC_CORRECTED_BYTES = 7;
     FEC_CORRECTED_CODEWORDS = 8;
     FEC_CORRECTED_ERRORS = 9;
     FEC_POST_FEC_BER = 10;
     FEC_PRE_FEC_BER = 11;
     FEC_SYMBOL_ERRORS = 12;
     FEC_UNCORRECTABLE_BITS = 13;
     FEC_UNCORRECTABLE_BLOCKS = 14;
     FEC_UNCORRECTABLE_BYTES = 15;
     FEC_UNCORRECTABLE_WORDS = 16;
     FEC_UNCORRECTED_CODEWORDS = 17;
     FREQ_OFFS = 18;
     OPTICAL_GAIN = 19;
     OPT_PWR_SPECTR_DENS_INPUT = 20;
     OPT_PWR_SPECTR_DENS_OUTPUT = 21;
     OPT_TOTAL_PWR_INPUT = 22;
     OPT_TOTAL_PWR_OUTPUT = 23;
     OPTICAL_TILT = 24;
     POL_MODE_DISP = 25;
     SES = 26;
     UAS = 27;
     VOA_INPUT = 28;
     VOA_OUTPUT = 29;
}